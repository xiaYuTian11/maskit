<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 15px; fill: #1e293b; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 11px; fill: #059669; }
      .flow-text { font-family: "JetBrains Mono", Consolas, Menlo, monospace; font-size: 11.5px; font-weight: 600; }
      .card-border { stroke: #e2e8f0; stroke-width: 1.5; fill: #ffffff; rx: 14; }
      .core-border { stroke: #10b981; stroke-width: 2; fill: #f0fdf4; rx: 16; }
      .arrow-line { stroke-width: 2; stroke-linecap: round; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 8 1.5 L 0 5 L 8 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="370" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Card: Terminal / Client -->
  <g transform="translate(30, 45)">
    <rect width="200" height="280" class="card-border" filter="url(#shadow)"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#grad-blue)"/>
    <!-- Terminal Icon -->
    <path d="M28 32 L36 38 L28 44 M37 44 L45 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="36" class="title-text">开发客户端</text>
    <text x="68" y="52" class="desc-text">IDE / 编码助手 / CLI</text>
    
    <rect x="16" y="80" width="168" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="103" class="desc-text" font-weight="600" fill="#334155">💻 Cursor / Claude Code</text>

    <rect x="16" y="128" width="168" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="151" class="desc-text" font-weight="600" fill="#334155">⚡ Aider / OpenCode</text>

    <rect x="16" y="176" width="168" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="199" class="desc-text" font-weight="600" fill="#334155">🤖 LangChain / 脚本请求</text>

    <rect x="16" y="228" width="168" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="32" y="250" class="desc-text" font-weight="600" fill="#1d4ed8">BaseURL: 127.0.0.1</text>
  </g>

  <!-- Center Card: Data Maskit Gateway -->
  <g transform="translate(290, 30)">
    <rect width="340" height="310" class="core-border" filter="url(#shadow)"/>
    <rect x="25" y="22" width="40" height="40" rx="10" fill="url(#grad-green)"/>
    <!-- Shield Check Icon -->
    <path d="M45 32 C38 32 35 34 35 41 C35 52 45 56 45 56 C45 56 55 52 55 41 C55 34 52 32 45 32 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M41 43 L44 46 L49 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="78" y="40" class="title-text" font-size="17px">Data Maskit 隐私网关</text>
    <text x="78" y="58" class="desc-text">100% 纯本地运行 · 零外传安全边界</text>

    <!-- Upstream step box -->
    <rect x="20" y="80" width="300" height="98" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="38" cy="100" r="10" fill="#10b981"/>
    <text x="35" y="104" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1</text>
    <text x="56" y="104" class="title-text" font-size="13px" fill="#047857">请求自动拦截打码 (Request Masking)</text>
    <text x="32" y="126" class="desc-text">• 正则智能扫描（密钥 / IP / 手机 / 身份证）</text>
    <text x="32" y="146" class="desc-text">• 替换为不透明占位符 <tspan fill="#0284c7" font-weight="bold">{{LABEL_xxxxxx}}</tspan></text>
    <text x="32" y="166" class="desc-text">• 保证上行网络流量绝对不包含明文敏感数据</text>

    <!-- Downstream step box -->
    <rect x="20" y="190" width="300" height="98" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="38" cy="210" r="10" fill="#10b981"/>
    <text x="35" y="214" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2</text>
    <text x="56" y="214" class="title-text" font-size="13px" fill="#047857">回复打字机无感还原 (Stream Restore)</text>
    <text x="32" y="236" class="desc-text">• SSE <tspan font-family="monospace">text/event-stream</tspan> 逐事件流式接管</text>
    <text x="32" y="256" class="desc-text">• 跨 chunk 边界占位符智能缓冲拼接</text>
    <text x="32" y="276" class="desc-text">• 秒级还原为原始明文，丝滑打字机阅读体验</text>
  </g>

  <!-- Right Card: Upstream LLM -->
  <g transform="translate(690, 45)">
    <rect width="200" height="280" class="card-border" filter="url(#shadow)"/>
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#grad-purple)"/>
    <!-- Cloud Icon -->
    <path d="M44 42 C46.5 42 48 40.5 48 38 C48 35.8 46.2 34 44 34 C43.8 31.5 41.5 29.5 39 30 C37.8 28 35 27 33 28.5 C31 30 30.5 32 31 34 C29 34 27 35.5 27 38 C27 40.5 29 42 31 42 Z" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <text x="68" y="36" class="title-text">外部大模型服务</text>
    <text x="68" y="52" class="desc-text">公共云 API / 商业中转</text>

    <rect x="16" y="80" width="168" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="103" class="desc-text" font-weight="600" fill="#334155">🧠 OpenAI (GPT-4o / o3)</text>

    <rect x="16" y="128" width="168" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="151" class="desc-text" font-weight="600" fill="#334155">🚀 Anthropic (Claude 3.7)</text>

    <rect x="16" y="176" width="168" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="199" class="desc-text" font-weight="600" fill="#334155">🐳 DeepSeek (V3 / R1)</text>

    <rect x="16" y="228" width="168" height="36" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1"/>
    <text x="28" y="250" class="desc-text" font-weight="600" fill="#a21caf">只接收到脱敏占位符</text>
  </g>

  <!-- Connections (Upstream - Request) -->
  <path d="M 230 115 L 290 115" class="arrow-line" stroke="#3b82f6" marker-end="url(#arrow-right)"/>
  <rect x="235" y="93" width="50" height="18" rx="4" fill="#dbeafe"/>
  <text x="242" y="106" class="flow-text" fill="#1e40af">明文</text>

  <path d="M 630 115 L 690 115" class="arrow-line" stroke="#3b82f6" marker-end="url(#arrow-right)"/>
  <rect x="635" y="93" width="50" height="18" rx="4" fill="#e0f2fe"/>
  <text x="640" y="106" class="flow-text" fill="#0369a1">占位符</text>

  <!-- Connections (Downstream - Response) -->
  <path d="M 690 250 L 630 250" class="arrow-line" stroke="#10b981" marker-end="url(#arrow-left)"/>
  <rect x="635" y="228" width="50" height="18" rx="4" fill="#e0f2fe"/>
  <text x="640" y="241" class="flow-text" fill="#0369a1">占位符</text>

  <path d="M 290 250 L 230 250" class="arrow-line" stroke="#10b981" marker-end="url(#arrow-left)"/>
  <rect x="235" y="228" width="50" height="18" rx="4" fill="#dcfce7"/>
  <text x="242" y="241" class="flow-text" fill="#15803d">明文</text>

</svg>
