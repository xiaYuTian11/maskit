name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release jobs opt into write permissions explicitly. A manual run on a branch is
# intentionally a no-op: publishing is only allowed from an immutable vX.Y.Z tag.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify tag, manifests, lockfiles, and public-release policy
        run: |
          python scripts/check-version.py --tag "$GITHUB_REF_NAME"
          python scripts/audit-public-release.py

  docker-smoke:
    name: Docker amd64 smoke test
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local smoke image
        run: docker build --platform linux/amd64 --tag maskit:release-smoke .
      - name: Start and probe container
        shell: bash
        run: |
          set -euo pipefail
          token='ci-release-smoke-token-1234567890'
          docker run --detach --name maskit-release-smoke \
            --env MASKIT_PANEL_TOKEN="$token" \
            --publish 5801:5801 \
            maskit:release-smoke
          cleanup() { docker logs maskit-release-smoke || true; docker rm --force maskit-release-smoke || true; }
          trap cleanup EXIT
          configured_user=$(docker inspect --format '{{.Config.User}}' maskit-release-smoke)
          test "$configured_user" = 'maskit' || { echo "container user is $configured_user, expected maskit" >&2; exit 1; }
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5801/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'healthz did not become ready'; exit 1; fi
            sleep 2
          done
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5801/api/status)
          test "$code" = 401 || test "$code" = 403
          curl --fail --silent -H "X-Shield-Token: $token" http://127.0.0.1:5801/api/status >/dev/null

  docker:
    name: Docker image (ghcr.io, amd64 + arm64)
    # 必须等桌面端全部构建成功再推镜像：ghcr 上会打 `latest` 与 `vX.Y.Z` 两个 tag，
    # 若桌面端（Tauri 打包）失败导致整次发版中止，镜像却已经推上去了 ——
    # 于是 ghcr 上躺着一个「没有对应 GitHub Release」的版本，用户 pull latest
    # 拿到的就是未发布产物。docker-smoke 仍然保留（镜像自身能不能跑）。
    needs: [docker-smoke, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            # `latest` 别名只给正式版：tag 里出现 `-` 就是预发布（正式版约定是纯 vX.Y.Z）。
            # 不要枚举 -beta/-alpha/-rc —— 版本工具链（bump-version.py）接受任意后缀，
            # 枚举法会让 v1.2.3-dev 拿到 latest，把 `ghcr.io/...:latest` 换成非正式构建
            # （NAS/团队用户 pull latest 直接吃到）。本 job 仅在 refs/tags/v* 上跑，
            # 所以 ref_name 一定是 tag 名，判据与 release-draft 里的 is_prerelease 同口径。
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Fetch NER model for All-in-One Docker image
        shell: bash
        run: |
          mkdir -p engine/models/ner_mini_zh
          curl -sSL https://github.com/xiaYuTian11/maskit/releases/download/v0.3.0/ner_mini_zh.zip -o ner_mini_zh.zip
          unzip -q -o ner_mini_zh.zip -d engine/models/ner_mini_zh
          rm -f ner_mini_zh.zip
          for model_file in model_quantized.onnx tokenizer.json config.json; do
            test -s "engine/models/ner_mini_zh/$model_file"
          done
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop ${{ matrix.platform }} (${{ matrix.bundle }})
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
            shell: pwsh
          - platform: macos-arm64
            os: macos-latest
            bundle: 'app,dmg'
            shell: bash
          - platform: linux-x64
            os: ubuntu-22.04
            bundle: 'deb,appimage'
            shell: bash
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            bundle: 'deb,appimage'
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable (pinned commit)
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri

      - name: Install Linux bundler dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install Python and frontend dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install Python and frontend dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Fetch NER model for All-in-One bundle
        shell: bash
        run: |
          mkdir -p engine/models/ner_mini_zh
          curl -sSL https://github.com/xiaYuTian11/maskit/releases/download/v0.3.0/ner_mini_zh.zip -o ner_mini_zh.zip
          unzip -q -o ner_mini_zh.zip -d engine/models/ner_mini_zh
          rm -f ner_mini_zh.zip
          for model_file in model_quantized.onnx tokenizer.json config.json; do
            test -s "engine/models/ner_mini_zh/$model_file"
          done

      - name: Build PyInstaller sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist_engine) { Remove-Item -Recurse -Force dist_engine }
          if (Test-Path build_engine) { Remove-Item -Recurse -Force build_engine }
          python -m PyInstaller engine\maskit-engine.spec --noconfirm --distpath dist_engine --workpath build_engine
          $target = 'src-tauri\resources\engine'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Recurse dist_engine\MaskitEngine\_internal "$target\_internal"
          Copy-Item dist_engine\MaskitEngine\MaskitEngine.exe "$target\MaskitEngine.exe"
          $count = (Get-ChildItem "$target\_internal" -Recurse -File | Measure-Object).Count
          if (-not (Test-Path "$target\MaskitEngine.exe") -or $count -lt 100) { throw "sidecar incomplete ($count files)" }
          python tests/smoke_transport.py --engine "$target\MaskitEngine.exe" --ner
          if ($LASTEXITCODE -ne 0) { throw "frozen sidecar smoke failed" }

      - name: Build PyInstaller sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist_engine build_engine src-tauri/resources/engine
          python3 -m PyInstaller engine/maskit-engine.spec --noconfirm --distpath dist_engine --workpath build_engine
          mkdir -p src-tauri/resources/engine
          cp -a dist_engine/MaskitEngine/_internal src-tauri/resources/engine/_internal
          cp dist_engine/MaskitEngine/MaskitEngine src-tauri/resources/engine/MaskitEngine
          chmod +x src-tauri/resources/engine/MaskitEngine
          test -x src-tauri/resources/engine/MaskitEngine
          test "$(find src-tauri/resources/engine/_internal -type f | wc -l)" -ge 100
          python3 tests/smoke_transport.py --engine src-tauri/resources/engine/MaskitEngine --ner
          python3 tests/smoke_packaged_panel.py --engine src-tauri/resources/engine/MaskitEngine --expect-ner

      - name: Select updater mode (Windows)
        if: runner.os == 'Windows'
        id: mode_windows
        shell: pwsh
        env:
          MASKIT_SIGNING_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MASKIT_SIGNING_KEY)) {
            'mode=unsigned' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content src-tauri\tauri.unsigned.json -Encoding utf8
          } else {
            'mode=signed' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Select updater mode (Unix)
        if: runner.os != 'Windows'
        id: mode_unix
        shell: bash
        env:
          MASKIT_SIGNING_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MASKIT_SIGNING_KEY:-}" ]; then
            echo 'mode=unsigned' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.unsigned.json
          else
            echo 'mode=signed' >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Tauri bundle (Windows)
        if: runner.os == 'Windows' && steps.mode_windows.outputs.mode == 'signed'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }}

      - name: Build unsigned Tauri bundle (Windows)
        if: runner.os == 'Windows' && steps.mode_windows.outputs.mode == 'unsigned'
        shell: pwsh
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }} --config src-tauri/tauri.unsigned.json

      - name: Build signed Tauri bundle (Unix)
        if: runner.os != 'Windows' && steps.mode_unix.outputs.mode == 'signed'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles '${{ matrix.bundle }}'

      - name: Build unsigned Tauri bundle (Unix)
        if: runner.os != 'Windows' && steps.mode_unix.outputs.mode == 'unsigned'
        shell: bash
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles '${{ matrix.bundle }}' --config src-tauri/tauri.unsigned.json

      - name: Validate desktop output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem src-tauri\target\release\bundle\nsis -File -ErrorAction SilentlyContinue
          if (-not $bundle) { throw 'NSIS bundle missing' }
          $mode = '${{ steps.mode_windows.outputs.mode }}'
          if ($mode -eq 'signed' -and -not (Get-ChildItem src-tauri\target\release\bundle -Filter '*.sig' -Recurse -File)) { throw 'signed bundle has no .sig' }
          if ($mode -eq 'unsigned') { 'UNSIGNED: no updater signature was generated for this bundle.' | Set-Content src-tauri\target\release\bundle\UNSIGNED.txt }

      - name: Validate desktop output (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -d src-tauri/target/release/bundle
          count=$(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) | wc -l)
          test "$count" -gt 0
          mode='${{ steps.mode_unix.outputs.mode }}'
          if [ "$mode" = signed ] && ! find src-tauri/target/release/bundle -type f -name '*.sig' -print -quit | grep -q .; then
            echo 'signed bundle has no .sig' >&2
            exit 1
          fi
          if [ "$mode" = unsigned ]; then
            printf '%s\n' 'UNSIGNED: no updater signature was generated for this bundle.' > src-tauri/target/release/bundle/UNSIGNED.txt
          fi
          # 移除未打包的散装 .app 目录，避免内部上百个散装文件被误当作 Release 资产上传或计入校验和
          rm -rf src-tauri/target/release/bundle/macos/*.app
          # Tauri 打 dmg 时把 create-dmg 的辅助脚本和图标留在 bundle/dmg/，并把 create-dmg 自带的
          # 支持文件摊在 bundle/share/ 下；上传路径是整棵 bundle 目录，这些中间产物会一起变成
          # Release 资产（v0.2.7 就发出了 bundle_dmg.sh / icon.icns / eula-resources-template.xml /
          # template.applescript）。这里只删中间产物，保留真正的 .dmg 产物本身。
          rm -rf src-tauri/target/release/bundle/share
          find src-tauri/target/release/bundle/dmg -type f ! -name '*.dmg' -delete || true
          # Linux 侧清理：Tauri 生成 deb 与 appimage 时会把中间展开构建树（含 engine/_internal 下成百上千散装库文件）
          # 留在 bundle/deb/ 与 bundle/appimage/ 下。必须清理掉，仅保留真正的 .deb、.AppImage、.tar.gz* 及 .sig 文件。
          if [ -d src-tauri/target/release/bundle/deb ]; then
            find src-tauri/target/release/bundle/deb -mindepth 1 ! -name '*.deb' -exec rm -rf {} + || true
          fi
          if [ -d src-tauri/target/release/bundle/appimage ]; then
            find src-tauri/target/release/bundle/appimage -mindepth 1 ! -name '*.AppImage*' -exec rm -rf {} + || true
          fi

      - name: Assert packaged engine contents (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 断言的是「产物里面有没有引擎」，不是「构建目录里有没有」。resources 映射失效时
          # Tauri 照样出一个上百 MB、能正常安装的 deb，用户点开只有「引擎缺失」四个字，
          # 而这一步之前整条流水线全绿。dpkg-deb -c 是唯一能看见包内真实路径的便宜手段。
          required=(
            resources/engine/MaskitEngine
            resources/engine/_internal/transparent.py
            resources/engine/_internal/inspection.py
            resources/engine/_internal/protocol_contracts.py
            resources/engine/_internal/onboarding.py
            resources/engine/_internal/skill_bundle/SKILL.md
            resources/engine/_internal/models/ner_mini_zh/model_quantized.onnx
          )
          listing="$RUNNER_TEMP/package-listing.txt"
          found=0
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            [ -e "$deb" ] || continue
            found=1
            dpkg-deb -c "$deb" > "$listing"
            missing=()
            for entry in "${required[@]}"; do
              grep -q "/${entry}\$" "$listing" || missing+=("$entry")
            done
            if [ ${#missing[@]} -gt 0 ]; then
              echo "$(basename "$deb") is missing: ${missing[*]}" >&2
              echo 'installer ships without a complete engine; aborting release' >&2
              exit 1
            fi
            echo "ok: $(basename "$deb") ships the frozen engine and the NER model"
          done
          if [ "$found" -eq 0 ]; then
            echo 'no .deb was produced' >&2
            exit 1
          fi

      # Tauri bundler 只为 updater 载体（.exe / .app.tar.gz / .AppImage）产出 .sig；
      # .deb 走的是 updater 的 install_deb（pkexec dpkg -i），它同样要求 latest.json
      # 里带上 minisign 签名 —— 缺签名会在 download 阶段就失败，所以必须自己补签。
      - name: Sign Linux packages for updater (deb)
        if: runner.os == 'Linux' && steps.mode_unix.outputs.mode == 'signed'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo 'no .deb was produced to sign' >&2
            exit 1
          fi
          for deb in "${debs[@]}"; do
            node frontend/node_modules/@tauri-apps/cli/tauri.js signer sign "$deb"
          done
          sigs=(src-tauri/target/release/bundle/deb/*.deb.sig)
          if [ "${#sigs[@]}" -ne "${#debs[@]}" ]; then
            echo "expected ${#debs[@]} signatures, got ${#sigs[@]}" >&2
            exit 1
          fi
          for sig in "${sigs[@]}"; do
            test -s "$sig" || { echo "empty signature: $sig" >&2; exit 1; }
            echo "signed: $(basename "$sig")"
          done

      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHECKSUM_PLATFORM: ${{ matrix.platform }}
          CHECKSUM_MODE: ${{ steps.mode_windows.outputs.mode }}
        run: python -c "import hashlib, os; from pathlib import Path; root=Path('src-tauri/target/release/bundle'); files=sorted(p for p in root.rglob('*') if p.is_file() and not p.name.startswith('SHA256SUMS-')); out=root/('SHA256SUMS-'+os.environ['CHECKSUM_PLATFORM']+'-'+os.environ['CHECKSUM_MODE']+'.txt'); out.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix()+'\\n' for p in files), encoding='utf-8'); assert out.stat().st_size > 0"

      - name: Generate SHA-256 checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CHECKSUM_PLATFORM: ${{ matrix.platform }}
          CHECKSUM_MODE: ${{ steps.mode_unix.outputs.mode }}
        run: python3 -c "import hashlib, os; from pathlib import Path; root=Path('src-tauri/target/release/bundle'); files=sorted(p for p in root.rglob('*') if p.is_file() and not p.name.startswith('SHA256SUMS-')); out=root/('SHA256SUMS-'+os.environ['CHECKSUM_PLATFORM']+'-'+os.environ['CHECKSUM_MODE']+'.txt'); out.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix()+'\n' for p in files), encoding='utf-8'); assert out.stat().st_size > 0"

      - name: Upload desktop bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maskit-${{ matrix.platform }}-${{ steps.mode_windows.outputs.mode }}${{ steps.mode_unix.outputs.mode }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 14

  # 扩展 zip 单独出一个 job，而不是塞进 desktop：它跟 Tauri 打包、签名、多平台矩阵
  # 没有任何关系（纯静态文件 + stdlib 打包脚本），塞进去只会跟着 120 分钟的长任务一起
  # 重跑；但产物必须进同一个 Release —— 网页版 AI（ChatGPT / Claude）没有 Base URL 可配，
  # 用户装完桌面端还得有扩展才能把网页请求送进引擎。
  extension:
    name: Browser extension package
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build extension zip
        run: python scripts/pack-extension.py --out dist_extension
      - name: Upload extension bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maskit-extension
          path: dist_extension
          if-no-files-found: error
          retention-days: 14

  # 占位符 Skill 包：与扩展同理，是「不在安装包里的用户可见产物」。
  # 它是行为契约的唯一分发形态——契约装不上时模型会自己发明规则
  # （把占位符换成 sk-test-*、对 token 做哈希、声称被阻断的任务已完成）。
  # 纯静态文件 + stdlib 脚本，独立 job 以免跟着 120 分钟的桌面矩阵重跑。
  skill:
    name: Placeholder skill package
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build skill zip
        run: python scripts/pack-skill.py --out dist_skill
      - name: Upload skill bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maskit-skill
          path: dist_skill
          if-no-files-found: error
          retention-days: 14

  release-draft:
    name: GitHub Release draft
    # 桌面端、扩展与 Skill 产物就绪即可直接发布，不被 Docker 多架构镜像构建阻塞
    needs: [desktop, extension, skill]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 必须取全历史：`render-release-notes.py` 用 `git describe HEAD^` 判定
          # 「相对上一个 tag，extension/ 有没有改动」。浅克隆下 HEAD^ 不存在，
          # 判定会退化成拿当前 tag 与当前提交相比（恒无差异）→ Release 页谎报
          # 「扩展无改动」，而扩展没重载时会静默失效。
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: 'maskit-*'
          path: release-assets
          merge-multiple: false
      - name: Create draft and attach verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_count=$(find release-assets -name UNSIGNED.txt -type f | wc -l)
          is_prerelease=false
          # 判定口径：tag 里出现 `-` 即为预发布（正式版约定是纯 vX.Y.Z）。
          # **不要枚举 -beta/-alpha/-rc**：`bump-version.py` 实测接受任意后缀
          # （`bump-version.py 1.2.3-dev` 也返回 Success 并改写 6 处版本文件），
          # 枚举法会让 v1.2.3-dev 走进正式版分支——生成并上传 latest.json，
          # 全体现网客户端把它当正式更新拉走，而这个后果不可撤回。
          # 方向保守：多判成预发布只是「这次不发自动更新」（Release 标 Pre-release、
          # latest.json 不产出）；误判成正式版是用户可见且不可逆的。
          # 与 docker job 的 `latest` 别名判据（同一工作流内）必须同口径。
          if [[ "$GITHUB_REF_NAME" == *"-"* ]]; then
            is_prerelease=true
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release 已存在 —— 走的是「移动 tag 重跑」场景：把 body 更新到最新的双语版本，
            # 资产由下面的 `gh release upload --clobber` 覆盖；注意 upload 不会删除线上多余资产，
            # 因此 bundle/share、bundle/dmg 下的中间产物需要单独清掉（见下面 stray 段）。
            echo "Release $GITHUB_REF_NAME already exists."
            if [ "$unsigned_count" -gt 0 ]; then
              echo "Release already exists and CI artifacts are unsigned. Preserving existing signed release assets."
              exit 0
            fi
            note=$(python3 scripts/render-release-notes.py "${GITHUB_REF_NAME#v}")
            if [ "$is_prerelease" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --notes "$note" --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --notes "$note"
            fi
          else
            if [ "$unsigned_count" -gt 0 ]; then
              note='At least one desktop bundle is UNSIGNED. No updater signature was produced for it, so automatic updates are not offered for those bundles; install them manually instead.'
            else
              note=$(python3 scripts/render-release-notes.py "${GITHUB_REF_NAME#v}")
            fi
            if [ "$is_prerelease" = true ]; then
              gh release create "$GITHUB_REF_NAME" --draft --prerelease --generate-notes --title "Data Maskit $GITHUB_REF_NAME" --notes "$note"
            else
              gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Data Maskit $GITHUB_REF_NAME" --notes "$note"
            fi
          fi
          # 自动清理线上已存在的非白名单资产（避免历史失败或中间重试遗留散装库/临时文件）
          python3 -c '
          import subprocess, json, sys, os
          tag = os.environ.get("GITHUB_REF_NAME", "")
          try:
              raw = subprocess.check_output(["gh", "release", "view", tag, "--json", "assets"], text=True)
              assets = json.loads(raw).get("assets", [])
              keep_exts = (".exe", ".exe.sig", ".msi", ".dmg", ".dmg.sig", ".deb", ".deb.sig", ".appimage", ".appimage.sig", ".appimage.tar.gz", ".appimage.tar.gz.sig", ".app.tar.gz", ".app.tar.gz.sig", ".zip")
              for a in assets:
                  name = a["name"]
                  low = name.lower()
                  if name == "latest.json" or name.startswith("SHA256SUMS-") or name == "UNSIGNED.txt":
                      continue
                  if any(low.endswith(ext) for ext in keep_exts):
                      continue
                  subprocess.run(["gh", "release", "delete-asset", tag, name, "--yes"], check=False)
                  print(f"Removed stray release asset: {name}")
          except Exception as exc:
              print(f"Cleanup stray assets skipped: {exc}", file=sys.stderr)
          '
          # 仅上传合法且非空的 Release 资产文件（安装包、压缩包、签名、校验和），杜绝任何中间临时文件被误传
          while IFS= read -r -d '' file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done < <(find release-assets -type f -size +0c \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage*' -o -name '*.zip' -o -name '*.sig' -o -name '*.tar.gz' -o -name 'SHA256SUMS-*.txt' -o -name 'UNSIGNED.txt' \) ! -name 'latest.json' -print0)

          # 若存在已签名安装包（.sig），且非 Beta 预发布版本，自动组装并上传 latest.json 更新元数据
          # Beta 预发布版本绝对不上传 latest.json，防止现网普通客户端误检测到更新
          if [ "$is_prerelease" = false ]; then
            python3 scripts/generate-latest-json.py release-assets
            if [ -f release-assets/latest.json ]; then
              gh release upload "$GITHUB_REF_NAME" release-assets/latest.json --clobber
              echo "Uploaded latest.json for $GITHUB_REF_NAME"
            fi
          else
            echo "Pre-release $GITHUB_REF_NAME detected; skipped generating latest.json to isolate auto-updates."
          fi

          # 所有资产上传完成后自动发布，避免长期停留 Draft —— 但**仅限签名完整时**。
          # 签名缺失时必须留在 Draft：generate-latest-json.py 没有 .sig 就不产出
          # latest.json，而新 Release 会立刻成为 releases/latest，于是全体现网用户的
          # releases/latest/download/latest.json 立刻 404 → 自动更新静默断更，
          # 用户端没有任何提示（审计 P0）。宁可停在草稿等人处理。
          if [ "$unsigned_count" -gt 0 ]; then
            {
              echo "## ⚠️ Release 保持草稿（存在未签名产物）"
              echo ""
              echo "有 $unsigned_count 个桌面安装包没有生成更新签名，因此 **没有产出 latest.json**。"
              echo "此时若转正，\`releases/latest/download/latest.json\` 会对所有已安装用户返回 404，自动更新静默失效。"
              echo ""
              echo "处理方式：修好签名 secret 后重跑该 tag，或手工补上 latest.json 后再手动发布。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=未签名 Release 已保持草稿::$unsigned_count 个安装包未签名、未生成 latest.json；为避免全量用户更新检查 404，Release 保持 Draft。"
            echo "Kept release $GITHUB_REF_NAME as draft (unsigned artifacts)."
          else
            if [ "$is_prerelease" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
              echo "Published pre-release $GITHUB_REF_NAME (isolated from updater)"
            else
              gh release edit "$GITHUB_REF_NAME" --draft=false
              echo "Published release $GITHUB_REF_NAME"
            fi
          fi
