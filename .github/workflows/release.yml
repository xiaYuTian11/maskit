name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release jobs opt into write permissions explicitly. A manual run on a branch is
# intentionally a no-op: publishing is only allowed from an immutable vX.Y.Z tag.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify tag, manifests, lockfiles, and public-release policy
        run: |
          python scripts/check-version.py --tag "$GITHUB_REF_NAME"
          python scripts/audit-public-release.py

  docker-smoke:
    name: Docker amd64 smoke test
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build local smoke image
        run: docker build --platform linux/amd64 --tag maskit:release-smoke .
      - name: Start and probe container
        shell: bash
        run: |
          set -euo pipefail
          token='ci-release-smoke-token-1234567890'
          docker run --detach --name maskit-release-smoke \
            --env MASKIT_PANEL_TOKEN="$token" \
            --publish 5801:5801 \
            maskit:release-smoke
          cleanup() { docker logs maskit-release-smoke || true; docker rm --force maskit-release-smoke || true; }
          trap cleanup EXIT
          configured_user=$(docker inspect --format '{{.Config.User}}' maskit-release-smoke)
          test "$configured_user" = 'maskit' || { echo "container user is $configured_user, expected maskit" >&2; exit 1; }
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5801/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'healthz did not become ready'; exit 1; fi
            sleep 2
          done
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5801/api/status)
          test "$code" = 401 || test "$code" = 403
          curl --fail --silent -H "X-Shield-Token: $token" http://127.0.0.1:5801/api/status >/dev/null

  docker:
    name: Docker image (ghcr.io, amd64 + arm64)
    needs: docker-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop ${{ matrix.platform }} (${{ matrix.bundle }})
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
            shell: pwsh
          - platform: macos-arm64
            os: macos-15
            bundle: dmg
            shell: bash
          - platform: macos-x64
            os: macos-15-intel
            bundle: dmg
            shell: bash
          - platform: linux-x64
            os: ubuntu-22.04
            bundle: deb,appimage
            shell: bash
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable (pinned commit)
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri

      - name: Install Linux bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libayatana-appindicator3-dev

      - name: Install Python and frontend dependencies
        shell: ${{ matrix.shell }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build PyInstaller sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist_engine) { Remove-Item -Recurse -Force dist_engine }
          if (Test-Path build_engine) { Remove-Item -Recurse -Force build_engine }
          python -m PyInstaller engine\maskit-engine.spec --noconfirm --distpath dist_engine --workpath build_engine
          $target = 'src-tauri\resources\engine'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Recurse dist_engine\MaskitEngine\_internal "$target\_internal"
          Copy-Item dist_engine\MaskitEngine\MaskitEngine.exe "$target\MaskitEngine.exe"
          $count = (Get-ChildItem "$target\_internal" -Recurse -File | Measure-Object).Count
          if (-not (Test-Path "$target\MaskitEngine.exe") -or $count -lt 100) { throw "sidecar incomplete ($count files)" }

      - name: Build PyInstaller sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist_engine build_engine src-tauri/resources/engine
          python -m PyInstaller engine/maskit-engine.spec --noconfirm --distpath dist_engine --workpath build_engine
          mkdir -p src-tauri/resources/engine
          cp -a dist_engine/MaskitEngine/_internal src-tauri/resources/engine/_internal
          cp dist_engine/MaskitEngine/MaskitEngine src-tauri/resources/engine/MaskitEngine
          chmod +x src-tauri/resources/engine/MaskitEngine
          test -x src-tauri/resources/engine/MaskitEngine
          test "$(find src-tauri/resources/engine/_internal -type f | wc -l)" -ge 100

      - name: Select updater mode (Windows)
        if: runner.os == 'Windows'
        id: mode_windows
        shell: pwsh
        env:
          MASKIT_SIGNING_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MASKIT_SIGNING_KEY)) {
            'mode=unsigned' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content src-tauri\tauri.unsigned.json -Encoding utf8
          } else {
            'mode=signed' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Select updater mode (Unix)
        if: runner.os != 'Windows'
        id: mode_unix
        shell: bash
        env:
          MASKIT_SIGNING_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MASKIT_SIGNING_KEY:-}" ]; then
            echo 'mode=unsigned' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.unsigned.json
          else
            echo 'mode=signed' >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Tauri bundle (Windows)
        if: runner.os == 'Windows' && steps.mode_windows.outputs.mode == 'signed'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }}

      - name: Build unsigned Tauri bundle (Windows)
        if: runner.os == 'Windows' && steps.mode_windows.outputs.mode == 'unsigned'
        shell: pwsh
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }} --config src-tauri/tauri.unsigned.json

      - name: Build signed Tauri bundle (Unix)
        if: runner.os != 'Windows' && steps.mode_unix.outputs.mode == 'signed'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MASKIT_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles '${{ matrix.bundle }}'

      - name: Build unsigned Tauri bundle (Unix)
        if: runner.os != 'Windows' && steps.mode_unix.outputs.mode == 'unsigned'
        shell: bash
        run: node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles '${{ matrix.bundle }}' --config src-tauri/tauri.unsigned.json

      - name: Validate desktop output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem src-tauri\target\release\bundle\nsis -File -ErrorAction SilentlyContinue
          if (-not $bundle) { throw 'NSIS bundle missing' }
          $mode = '${{ steps.mode_windows.outputs.mode }}'
          if ($mode -eq 'signed' -and -not (Get-ChildItem src-tauri\target\release\bundle -Filter '*.sig' -Recurse -File)) { throw 'signed bundle has no .sig' }
          if ($mode -eq 'unsigned') { 'UNSIGNED: updater signature and metadata were intentionally not generated.' | Set-Content src-tauri\target\release\bundle\UNSIGNED.txt }

      - name: Validate desktop output (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -d src-tauri/target/release/bundle
          count=$(find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) | wc -l)
          test "$count" -gt 0
          mode='${{ steps.mode_unix.outputs.mode }}'
          if [ "$mode" = signed ] && ! find src-tauri/target/release/bundle -type f -name '*.sig' -print -quit | grep -q .; then
            echo 'signed bundle has no .sig' >&2
            exit 1
          fi
          if [ "$mode" = unsigned ]; then
            printf '%s\n' 'UNSIGNED: updater signature and metadata were intentionally not generated.' > src-tauri/target/release/bundle/UNSIGNED.txt
          fi

      - name: Generate SHA-256 checksums
        shell: ${{ matrix.shell }}
        env:
          CHECKSUM_PLATFORM: ${{ matrix.platform }}
          CHECKSUM_MODE: ${{ runner.os == 'Windows' && steps.mode_windows.outputs.mode || steps.mode_unix.outputs.mode }}
        run: python -c "import hashlib, os; from pathlib import Path; root=Path('src-tauri/target/release/bundle'); files=sorted(p for p in root.rglob('*') if p.is_file() and not p.name.startswith('SHA256SUMS-')); out=root/('SHA256SUMS-'+os.environ['CHECKSUM_PLATFORM']+'-'+os.environ['CHECKSUM_MODE']+'.txt'); out.write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(root).as_posix()+'\\n' for p in files), encoding='utf-8'); assert out.stat().st_size > 0"

      - name: Upload desktop bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maskit-${{ matrix.platform }}-${{ runner.os == 'Windows' && steps.mode_windows.outputs.mode || steps.mode_unix.outputs.mode }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 14

  release-draft:
    name: GitHub Release draft
    needs: [docker, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: false
      - name: Create draft and attach verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_count=$(find release-assets -name UNSIGNED.txt -type f | wc -l)
          if [ "$unsigned_count" -gt 0 ]; then
            note='At least one desktop bundle is UNSIGNED. Updater signatures and latest.json metadata were intentionally not generated; use the installer manually and do not enable automatic updates for these assets.'
          else
            note='Desktop bundles were built and .sig files were verified where signing credentials were available. This workflow does not assemble or publish latest.json updater metadata; automatic update availability must be verified separately.'
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME" --notes "$note"
          while IFS= read -r -d '' file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done < <(find release-assets -type f ! -name 'latest.json' -print0)
