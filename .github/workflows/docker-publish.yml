name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker image (ghcr.io, amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            # `latest` 别名只给正式版：输入的 tag 里出现 `-` 即视为预发布，不覆盖 latest。
            # 与 release.yml 的 is_prerelease 同口径（tag 含 `-` 即预发布）；否则手动发布一个
            # beta 镜像会把 `ghcr.io/...:latest` 换成非正式构建，NAS/团队用户 pull latest 直接吃到。
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}
      - name: Fetch NER model for All-in-One Docker image
        shell: bash
        run: |
          mkdir -p engine/models/ner_mini_zh
          curl -sSL https://github.com/xiaYuTian11/maskit/releases/download/v0.3.0/ner_mini_zh.zip -o ner_mini_zh.zip
          unzip -q -o ner_mini_zh.zip -d engine/models/ner_mini_zh
          rm -f ner_mini_zh.zip
          test -f engine/models/ner_mini_zh/model_quantized.onnx
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 推完镜像后把 amd64 那份拉回来真跑一遍：/healthz 存活 + /api/skill/bundle 必须是
  # 真 zip。容器部署的“下载 Skill 包”曾恒 500（只有用户点了才知道），此前只有
  # Dockerfile 断言 + 测试树静态钉住，这里补上运行时证据；失败时打容器日志。
  container-smoke:
    name: Container smoke (healthz + skill bundle)
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the published image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${{ inputs.tag }}"
          # 仅验 amd64（runner 原生）；arm64 由构建矩阵自身保证，QEMU 运行冒烟太慢。
          docker pull --platform linux/amd64 "$IMAGE"
          cid=$(docker run -d -e MASKIT_PANEL_TOKEN=smoke-token-0123456789abcdef \
            -p 127.0.0.1:5801:5801 "$IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ready=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5801/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo 'container never became healthy' >&2
            docker logs "$cid" >&2 || true
            exit 1
          fi
          code=$(curl -sS -o /tmp/bundle.zip -w '%{http_code}' \
            -H 'X-Shield-Token: smoke-token-0123456789abcdef' \
            http://127.0.0.1:5801/api/skill/bundle)
          if [ "$code" != "200" ]; then
            echo "skill bundle endpoint returned $code" >&2
            head -c 400 /tmp/bundle.zip >&2 || true
            exit 1
          fi
          head -c 2 /tmp/bundle.zip | grep -q 'PK'
          python3 -c "import zipfile,sys; zipfile.ZipFile('/tmp/bundle.zip').testzip(); print('zip integrity OK')"
          docker rm -f "$cid" >/dev/null
          trap - EXIT
          echo "container smoke OK: /healthz 200, /api/skill/bundle 200 (valid zip)"
