name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# 只读权限：本工作流不引用任何 secret、不写回仓库
permissions:
  contents: read

# PR 连续推送只保留最新一次；主干 push 不取消（每个 commit 都要有完整门禁记录）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# job 名同时是分支保护里的 Required status check 名，保持英文、不含测试数量等易变信息
jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    # 超时兜底：冒烟测试会起真实 mitmdump 子进程，卡死时默认 6 小时的 job 上限
    # 会把 runner 一直占着（免费额度也会烧掉）。正常耗时 ~1 分钟。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile engine/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Smoke tests (stream, egress, transport & takeover)
        run: |
          python tests/smoke_stream.py
          python tests/smoke_egress.py
          python tests/smoke_transport.py
          python tests/smoke_takeover.py

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22.x（Active LTS）。下限 22.6：scripts/check-env-import.mjs 依赖
          # --experimental-strip-types 直接跑 TypeScript 源码，22.6 才引入该 flag。
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: i18n dictionary parity
        run: node ../scripts/check-i18n.mjs

      # .env 导入的解析/分类规则是纯函数，前端没有单测框架，所以固化成 Node 用例跑在这里。
      # 这些规则一旦被改坏（比如漏剥引号、误判凭据分类），脱敏会静默失效而不报错。
      - name: .env import parser cases
        run: node --experimental-strip-types ../scripts/check-env-import.mjs

      # 浏览器扩展（extension/）的静态门禁：i18n 键集一致性、shared.js 加载顺序、
      # 驼峰 runAt、静态站点清单与 manifest 对齐、安全红线扫描。
      # 放在本 job 只是因为这里已经装好了 node —— 扩展与前端是两套东西。
      - name: Browser extension static checks
        run: node ../scripts/check-extension.mjs

  rust:
    name: rust
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable (pinned commit)
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri

      # tauri.conf.json 的 bundle.resources 指向 resources/engine，codegen 要求目录存在
      - name: Prepare placeholder resources dir
        run: New-Item -ItemType Directory -Force -Path resources\engine

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test --lib

  # macOS 侧单独一个 job，而不是把 rust 改成 matrix：job 名同时是分支保护里的
  # Required status check 名（见本文件顶部注释），matrix 会把 check 名变成
  # `rust (macos-latest)`，分支保护里配的 `rust` 会立刻失效。
  #
  # 为什么需要它：src-tauri/src/lib.rs 里有 20+ 处 `#[cfg(target_os = "macos")]`
  # 分支，此前只有 windows 会编译 —— macOS 分支的编译错误要等到打 tag 走
  # release.yml（或手工触发 test-macos-build.yml）才暴露，而那时 tag 已经推出去了。
  rust-macos:
    name: rust-macos
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable (pinned commit)
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri

      # tauri.conf.json 的 bundle.resources 指向 resources/engine，codegen 要求目录存在
      - name: Prepare placeholder resources dir
        shell: bash
        run: mkdir -p resources/engine

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test --lib

  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # pyyaml 只给下面这条 workflow 校验用，其余校验脚本一律零依赖
      - name: Install workflow lint dependency
        run: python -m pip install --quiet 'pyyaml>=6,<7'

      # 这个步骤跑**两个**脚本，名字必须把两件事都说出来。
      # 旧名字只写了版本号一致性，结果 audit 失败时（实测 2026-09-19：文档里引用了
      # 一个 PEM 私钥头部字面量）报错信息指向「版本号不一致」，把人往完全错误的方向带。
      # 步骤名是失败时唯一可见的线索，别让它说谎。
      - name: Version numbers agree, and no credential/secret literals in tracked files
        run: |
          python scripts/check-version.py
          python scripts/audit-public-release.py

      # CI 不 lint workflow，YAML 或 run 块写坏只在推送后（最坏是发版时）才炸
      - name: Workflow YAML and shell syntax must be valid
        run: python scripts/check-workflows.py

      # 扩展 zip 是 Release 上唯一的「网页版 AI」入口（ChatGPT / Claude 没有 Base URL 可配），
      # 打包脚本坏掉＝用户下载不到扩展。这里只验证能打出来，产物由 release.yml 上传。
      - name: Browser extension package builds
        run: python scripts/pack-extension.py --check

      # 占位符 Skill 包（行为契约）同理：打包/渲染坏掉=用户装不上契约。
      # 与 verify-all.py 的 GATES 成对，check-workflows.py 双向比对。
      - name: Placeholder skill package builds
        run: python scripts/pack-skill.py --check
