name: Test macOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: Test macOS arm64 DMG Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable (pinned commit)
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build PyInstaller sidecar
        run: |
          set -euo pipefail
          rm -rf dist_engine build_engine src-tauri/resources/engine
          python3 -m PyInstaller engine/maskit-engine.spec --noconfirm --distpath dist_engine --workpath build_engine
          mkdir -p src-tauri/resources/engine
          cp -a dist_engine/MaskitEngine/_internal src-tauri/resources/engine/_internal
          cp dist_engine/MaskitEngine/MaskitEngine src-tauri/resources/engine/MaskitEngine
          chmod +x src-tauri/resources/engine/MaskitEngine
          test -x src-tauri/resources/engine/MaskitEngine
          test "$(find src-tauri/resources/engine/_internal -type f | wc -l)" -ge 100

      - name: Build Tauri DMG
        run: |
          printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.unsigned.json
          node frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles dmg --config src-tauri/tauri.unsigned.json

      - name: Verify DMG output
        run: |
          set -euo pipefail
          test -d src-tauri/target/release/bundle
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app' \) -print -exec ls -lh {} \;
          count=$(find src-tauri/target/release/bundle -type f -name '*.dmg' | wc -l)
          test "$count" -gt 0

      - name: Upload test DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maskit-macos-arm64-test-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
