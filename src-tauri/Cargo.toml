[package]
name = "maskit"
version = "0.2.4"
description = "数据面具 Maskit — 本地 LLM 敏感信息脱敏代理（Tauri 壳 + Python 引擎 sidecar）"
authors = ["TMW"]
license = "AGPL-3.0-only"
repository = "https://github.com/xiaYuTian11/maskit"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "maskit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
url = "2"
tokio = { version = "1", features = ["time"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-updater = "2"

# 只在 Windows 上需要：读写 HKCU\...\Run 做自启自愈。
# 用 winreg 而不是 `reg query` 拿 stdout —— reg 在中文 Windows 输出 GBK，
# 按 UTF-8 解会把中文安装路径解坏，而那条路径要拿来做比对。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
